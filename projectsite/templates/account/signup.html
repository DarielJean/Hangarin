{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hangarin Sign Up</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:300,400,600,700,800">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f5ff;
            font-family: 'Nunito', sans-serif;
            padding: 15px;
            margin: 0;
        }
        .auth-card {
            max-width: 460px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #d0e1fd;
            box-shadow: 0 4px 18px rgba(11, 37, 69, 0.05);
            padding: 2.25rem 1.75rem;
        }
        .form-control {
            border-color: #bcd7ff;
            color: #0b2545;
        }
        .form-control:focus {
            border-color: #004080;
            box-shadow: 0 0 0 0.2rem rgba(0, 64, 128, 0.15);
        }
    </style>
</head>
<body>
<div class="auth-card">
    <h3 class="font-weight-bold text-center mb-1" style="color: #0b2545;">Hangarin Sign Up</h3>
    <p class="text-center mb-4 small" style="color: #4a7bb0;">Create your account to get started</p>
    
    <form method="post" action="{% url 'account_signup' %}">
        {% csrf_token %}
        <div class="form-group mb-3">
            <label class="font-weight-bold small mb-1" style="color: #1a4971;">Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="form-group mb-3">
            <label class="font-weight-bold small mb-1" style="color: #1a4971;">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="form-group mb-3">
            <label class="font-weight-bold small mb-1" style="color: #1a4971;">Password</label>
            <input type="password" name="password1" class="form-control" required>
        </div>
        <div class="form-group mb-4">
            <label class="font-weight-bold small mb-1" style="color: #1a4971;">Confirm Password</label>
            <input type="password" name="password2" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-rounded text-white w-100 py-2 font-weight-bold" style="background-color: #003466; border-color: #003466;">
            Register
        </button>
    </form>
    
    <p class="text-center mt-4 mb-0 small" style="color: #4a7bb0;">
        Already have an account? <a href="{% url 'account_login' %}" class="font-weight-bold text-decoration-none" style="color: #0055b3;">Sign in</a>
    </p>
</div>
</body>
</html>
