{% load socialaccount %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hangarin Login</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:300,400,600,700,800">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f5ff;
            font-family: 'Nunito', sans-serif;
            padding: 15px;
            margin: 0;
        }
        .auth-card {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #d0e1fd;
            box-shadow: 0 4px 18px rgba(11, 37, 69, 0.05);
            padding: 2.25rem 1.75rem;
        }
        .social-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 44px;
            border: 1px solid #bcd7ff;
            background-color: #f0f5ff;
            border-radius: 8px;
            font-size: 18px;
            color: #003466;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .social-btn:hover {
            border-color: #004080;
            background-color: #e6f0ff;
            color: #0b2545;
            text-decoration: none;
        }
        .form-control {
            border-color: #bcd7ff;
            color: #0b2545;
        }
        .form-control:focus {
            border-color: #004080;
            box-shadow: 0 0 0 0.2rem rgba(0, 64, 128, 0.15);
        }
    </style>
</head>
<body>
<div class="auth-card">
    <h3 class="font-weight-bold text-center mb-3" style="color: #0b2545;">Hangarin Login</h3>
    
    <form method="post" action="{% url 'account_login' %}">
        {% csrf_token %}
        <div class="text-center mb-3">
            <p class="small font-weight-bold mb-2" style="color: #4a7bb0;">Sign in with:</p>
            <a href="{% provider_login_url 'google' %}" class="social-btn mx-1" title="Google Login">
                <i class="fab fa-google"></i>
            </a>
            <a href="{% provider_login_url 'github' %}" class="social-btn mx-1" title="GitHub Login">
                <i class="fab fa-github"></i>
            </a>
        </div>
        
        <div class="d-flex align-items-center my-3">
            <hr class="flex-grow-1" style="border-top: 1px solid #d0e1fd;">
            <span class="px-2 small font-weight-bold" style="color: #4a7bb0;">or</span>
            <hr class="flex-grow-1" style="border-top: 1px solid #d0e1fd;">
        </div>

        <div class="form-group mb-3">
            <label class="font-weight-bold small mb-1" style="color: #1a4971;">Username or Email</label>
            <input type="text" name="login" class="form-control" required>
        </div>
        
        <div class="form-group mb-3">
            <label class="font-weight-bold small mb-1" style="color: #1a4971;">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        {% if form.non_field_errors %}
        <div class="alert text-white mb-3" style="background-color: #002244; border-radius: 8px;">
            {% for error in form.non_field_errors %}
            <p class="mb-0 small">{{ error }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <button type="submit" class="btn btn-rounded text-white w-100 py-2 font-weight-bold mt-2" style="background-color: #003466; border-color: #003466;">
            Log In
        </button>
    </form>
    
    <p class="text-center mt-4 mb-0 small" style="color: #4a7bb0;">
        Don't have an account? <a href="{% url 'account_signup' %}" class="font-weight-bold text-decoration-none" style="color: #0055b3;">Sign up</a>
    </p>
</div>
</body>
</html>
