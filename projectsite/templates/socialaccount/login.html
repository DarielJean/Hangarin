{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm Sign In - Hangarin</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:300,400,600,700,800">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f5ff;
            font-family: 'Nunito', sans-serif;
            padding: 15px;
            margin: 0;
        }
        .auth-card {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #d0e1fd;
            box-shadow: 0 4px 18px rgba(11, 37, 69, 0.05);
            padding: 2rem 1.75rem;
            text-align: center;
        }
        .auth-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: #e6f0ff;
            border: 1px solid #bcd7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            font-size: 32px;
            color: #003466;
        }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="auth-icon">
        <i class="la la-user-check"></i>
    </div>
    <h4 class="font-weight-bold mb-2" style="color: #0b2545;">Confirm Sign In</h4>
    <p class="mb-4" style="color: #4a7bb0; font-size: 0.95rem;">
        You are about to sign in using your <strong style="color: #003466;">{{ provider.name }}</strong> account.
    </p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-rounded text-white w-100 py-2 font-weight-bold mb-3" style="background-color: #003466; border-color: #003466;">
            Continue with {{ provider.name }}
        </button>
    </form>
    <a href="{% url 'account_login' %}" class="btn btn-rounded w-100 py-2 font-weight-bold" style="background-color: #e6f0ff; color: #003466; border: 1px solid #bcd7ff;">
        Cancel
    </a>
</div>
</body>
</html>
